# Example automations: paste into Settings > Automations > (new) > Edit in YAML,
# one at a time, then swap in your own entity names (media_player.living_room_roku,
# light.tv_backlight, light.living_room_lights...).

# 1. "Theater mode": Meowbox opens on the Roku -> lights go to Meowbox purple.
alias: Meowbox theater mode
triggers:
  - trigger: state
    entity_id: media_player.living_room_roku
    attribute: app_name
    to: Meowbox
actions:
  - action: scene.create
    data:
      scene_id: before_meowbox
      snapshot_entities:
        - light.tv_backlight
        - light.living_room_lights
  - action: light.turn_on
    target:
      entity_id: light.tv_backlight
    data:
      rgb_color: [120, 80, 220]      # a brighter cousin of Meowbox's #120E1F splash
      brightness_pct: 35
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.living_room_lights
    data:
      brightness_pct: 8
      transition: 3
---
# 2. Leave Meowbox (or the Roku goes to sleep) -> put the room back how it was.
alias: Meowbox lights up
triggers:
  - trigger: state
    entity_id: media_player.living_room_roku
    attribute: app_name
    from: Meowbox
  - trigger: state
    entity_id: media_player.living_room_roku
    to: "off"
actions:
  - action: scene.turn_on
    target:
      entity_id: scene.before_meowbox
    data:
      transition: 2
---
# 3. Channel mood lighting. In Meowbox press * > Room lights and enter this
#    server's address. Each time a channel comes on, Meowbox sends its colour to
#    the "meowbox" webhook; on "leave" the room goes back to how it was.
#    Meowbox sends: event (tune | leave), channel, channel_id, dial, color, rgb.
alias: Meowbox channel colours
mode: restart
triggers:
  - trigger: webhook
    webhook_id: meowbox
    allowed_methods: [POST]
    local_only: true
actions:
  - choose:
      - conditions: "{{ trigger.json.event == 'tune' and trigger.json.rgb is defined }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.tv_backlight
            data:
              rgb_color: "{{ trigger.json.rgb }}"
              brightness_pct: 40
              transition: 1.5
      - conditions: "{{ trigger.json.event == 'leave' }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.before_meowbox
            data:
              transition: 2
